name: http-ts
description: >-
  Expose a Genkit app's flows and agents over HTTP. TypeScript
  implementation: compiled to JavaScript at install time (and again at image
  build time) via its declared build step.
version: 0.1.0
# This channel runs on Node, so its language is `node`. Unlike a plain-JS
# channel, it is written in TypeScript and declares a `build` that compiles it.
language: node
# `entry` points at the compiled output (relative to the channel dir). It does
# not exist on disk until the build has run.
entry: dist/index.js
# Build command run in the channel dir to produce `entry`. When the channel is
# installed with `genkit-channels add`, this runs after you confirm; it also runs
# in the container image build. `npm install` (not `--omit=dev`) so the
# TypeScript compiler in devDependencies is available.
build: npm install && npm run build

# Env var names the channel itself needs (surfaced in .env.example). None of its
# own; the user app's env is declared in the manifest.
env: []

# Service settings this channel recommends. HTTP endpoints are meant to be
# reachable, so the channel recommends public access. This is surfaced as a
# notice at deploy time and never auto-applied: the user must set
# `service.access: public` in channels.yaml to actually open the endpoint. The
# workload is request/response, so request-only CPU (the default) is fine.
recommends:
  service:
    access: public

# JSONata rules evaluated against the compose context (deployment, expose,
# config, env, child). A falsy `validate` result fails the deploy; a truthy
# `warn` result logs a warning.
warn:
  # Endpoints are publicly reachable unless auth is configured in `with`.
  - expr: >-
      $not($exists(config.auth))
    message: >-
      no auth configured (deployment.with.auth); the HTTP endpoints will be
      publicly reachable
