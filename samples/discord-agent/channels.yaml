# Wires this Genkit app to the Discord channel. Install the channel first with:
#
#   genkit-channel add ../../channels discord
#
# then deploy it locally:
#
#   genkit-channel deploy discord-bot --local
#
deployments:
  - name: discord-bot
    channel: discord
    runtime:
      language: js
      # How to build and run the app. The channel spawns this as a headless
      # child and talks to it over reflection v2.
      build: npm run build
      command: node
      args: [lib/index.js]
    expose:
      # The agent the Discord bot drives. Channels don't discover agents at
      # runtime (the app may not be running yet), so name it here.
      agent: weatherAgent
      # weatherAgent has a session store, so it is server-managed (the default).
      # Use `client` for agents without a store.
      agentState:
        weatherAgent: server
    # Channel-specific options (all optional). See channels/discord/channel.yaml.
    with:
      # 'thread' (default) keeps a separate conversation per thread/DM;
      # 'channel' shares one conversation per channel.
      session: thread
    # Secrets the app needs. The channel's own DISCORD_TOKEN is declared by the
    # channel (channel.yaml), so it isn't listed. Locally they come from
    # .env.local; on Cloud Run, from Secret Manager secrets of the same names
    # (deploy checks they exist and prints how to create any that don't).
    # To use a different secret name or pin a version:
    #   secrets:
    #     GEMINI_API_KEY: gemini-key@3
    secrets: [GEMINI_API_KEY]
    # How the app runs (all optional; @genkit-ai/box). The default is one local
    # subprocess, started on the first message.
    box:
      # The box gets only the basics (PATH, HOME, ...) plus the app's secrets.
      # DISCORD_TOKEN stays with the channel either way.
      env: []
      # Uncomment to jail the app in an OS sandbox (seatbelt on macOS,
      # bubblewrap on Linux). Dev-time guardrail, not containment.
      # runner:
      #   type: exec
      #   isolate: local
      # Uncomment for one box per Discord conversation, reclaimed after 10 idle
      # minutes. History survives reclaim because .snapshots is on disk.
      # route: session
      # idle: 10m
