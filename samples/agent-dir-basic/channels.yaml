# A runtime-less agent: no code, just a folder of agent prompts.
#
# With no `runtime` block the framework runs the built-in agent-dir runtime,
# which loads ./agents, installs the default middleware (filesystem, skills,
# retry, ...), and registers each agent folder as an agent. Set an API key
# (GEMINI_API_KEY) and it just works.
#
# Install the channel first, then run locally:
#
#   genkit-channel add ../../channels http
#   cp .env.example .env.local   # then fill in GEMINI_API_KEY and API_KEY
#   genkit-channel dev assistant
#
deployments:
  - name: assistant
    channel: http

    # No runtime: agents are loaded from ./agents by the built-in runtime.
    agents:
      # dir defaults to ./agents; model defaults to googleai/gemini-flash-latest.
      dir: ./agents
      model: googleai/gemini-flash-latest
    expose:
      # The agent the folder defines. Dir agents have no session store, so
      # callers carry the conversation state.
      agent: assistant
      agentState:
        assistant: client
      # No code to write a provider in, so use a built-in one: callers send
      # `Authorization: Bearer <key>`. The channel checks it before the app
      # starts, and the app never sees the keys. List a second secret to
      # rotate: add API_KEY_NEXT, move callers over, then drop API_KEY.
      contextProvider:
        apiKey: { secrets: [API_KEY] }
    # The model key, for the app. Locally from .env.local; on Cloud Run from
    # Secret Manager (as is API_KEY above).
    secrets: [GEMINI_API_KEY]
