# A Discord bot with no runtime code: just a folder of agent prompts.
#
# With no `runtime` block the framework runs the built-in agent-dir runtime,
# which loads ./agents, installs the default middleware (filesystem, skills,
# retry, ...), and registers each agent folder as an agent. The Discord channel
# runs it as a gateway bot.
#
# Install the channel, then run locally (see README for prerequisites):
#
#   genkit-channel add ../../channels discord
#   cp .env.example .env   # fill in DISCORD_TOKEN + GEMINI_API_KEY
#   genkit-channel dev discord-bot
#
deployments:
  - name: discord-bot
    channel: discord
    # No runtime: agents are loaded from ./agents by the built-in runtime.
    agents:
      # dir defaults to ./agents; model defaults to googleai/gemini-flash-latest.
      dir: ./agents
      model: googleai/gemini-flash-latest
    expose:
      # The agent the bot drives.
      agent: concierge
      # Dir agents have no session store, so the caller (the channel) carries
      # the conversation state.
      agentState:
        concierge: client
    # Channel-specific options (all optional). See channels/discord/channel.yaml.
    with:
      # 'thread' (default) keeps a separate conversation per thread/DM;
      # 'channel' shares one conversation per channel.
      session: thread
    # Secrets the app needs. The channel's own DISCORD_TOKEN is declared by the
    # channel (channel.yaml), so it isn't listed. Locally: .env.local. On Cloud
    # Run: Secret Manager secrets of the same names (deploy checks they exist).
    secrets: [GEMINI_API_KEY]
    # The agent runs in a box that only gets the basics plus its secrets.
    # DISCORD_TOKEN stays with the channel.
    box:
      env: []
